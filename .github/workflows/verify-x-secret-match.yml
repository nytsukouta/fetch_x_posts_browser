name: Verify X Secret Match

on:
  workflow_dispatch:
    inputs:
      nonce:
        description: "一時比較用 nonce"
        required: true
        type: string
      x_api_key_hmac:
        description: "X_API_KEY のローカル HMAC"
        required: true
        type: string
      x_api_secret_hmac:
        description: "X_API_SECRET のローカル HMAC"
        required: true
        type: string
      x_access_token_hmac:
        description: "X_ACCESS_TOKEN のローカル HMAC"
        required: true
        type: string
      x_access_token_secret_hmac:
        description: "X_ACCESS_TOKEN_SECRET のローカル HMAC"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NONCE: ${{ inputs.nonce }}
      EXPECTED_X_API_KEY: ${{ inputs.x_api_key_hmac }}
      EXPECTED_X_API_SECRET: ${{ inputs.x_api_secret_hmac }}
      EXPECTED_X_ACCESS_TOKEN: ${{ inputs.x_access_token_hmac }}
      EXPECTED_X_ACCESS_TOKEN_SECRET: ${{ inputs.x_access_token_secret_hmac }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
    steps:
      - name: Compare X credential fingerprints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import hmac
          import os

          nonce = os.environ["NONCE"]
          credentials = (
              "X_API_KEY",
              "X_API_SECRET",
              "X_ACCESS_TOKEN",
              "X_ACCESS_TOKEN_SECRET",
          )
          mismatches = []
          for name in credentials:
              actual = hmac.new(
                  nonce.encode("utf-8"),
                  os.environ.get(name, "").encode("utf-8"),
                  hashlib.sha256,
              ).hexdigest()
              expected = os.environ.get(f"EXPECTED_{name}", "")
              if not hmac.compare_digest(actual, expected):
                  mismatches.append(name)

          if mismatches:
              print("mismatch: " + ", ".join(mismatches))
              raise SystemExit(1)
          print("all four X credentials match the local fingerprints")
          PY
name: Daily Theater Pipeline

on:
  schedule:
    - cron: "10 22 * * *"
  workflow_dispatch:
    inputs:
      pipeline_mode:
        description: "実行モード"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - full
          - post-only
          - rebuild
          - pages
      post_mode:
        description: "X 投稿モード"
        required: true
        default: dry-run
        type: choice
        options:
          - "off"
          - dry-run
          - live
      force_collect:
        description: "収集間隔とstateを無視して再収集する"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-pipeline.yml"
      - "config/**"
      - "data/output/organization_master.csv"
      - "data/output/venue_master.csv"
      - "web/**"
      - "docs/**"
      - "src/**"

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: daily-theater-pipeline
  cancel-in-progress: false

jobs:
  mode:
    runs-on: ubuntu-latest
    outputs:
      pipeline_mode: ${{ steps.detect.outputs.pipeline_mode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect pipeline mode
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MODE: ${{ github.event.inputs.pipeline_mode || 'auto' }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            mode="full"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_MODE" != "auto" ]]; then
            mode="$DISPATCH_MODE"
          elif [[ "$EVENT_NAME" != "push" ]]; then
            mode="full"
          else
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
              mode="rebuild"
            else
              changed=$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
              mode="pages"
              while IFS= read -r path; do
                [[ -z "$path" ]] && continue
                case "$path" in
                  src/fetch_x_posts.py|src/extract_events_github_models.py|src/x_tweet_context.py|src/github_models_client.py|src/build_priority_queries_from_masters.py|data/output/organization_master.csv|data/output/venue_master.csv|.github/workflows/daily-pipeline.yml)
                    mode="rebuild"
                    ;;
                  config/manual_event_overrides.json|config/event_aliases.csv|src/event_candidate_rules.py|src/event_cumulative_core.py|src/event_cumulative_llm.py|src/build_event_cumulative.py|src/build_schedule_list.py|src/manual_event_overrides.py|src/run_pipeline.py)
                    [[ "$mode" == "pages" ]] && mode="rebuild"
                    ;;
                  web/*|docs/*|src/sync_web_to_docs.py)
                    [[ "$mode" == "pages" ]] && mode="rebuild"
                    ;;
                  *)
                    mode="rebuild"
                    ;;
                esac
              done <<< "$changed"
            fi
          fi
          echo "pipeline_mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Selected pipeline mode: $mode"

  start_runner:
    needs: mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_RUNNER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Start self-hosted runner VM
        run: az vm start --resource-group "${{ vars.AZURE_RUNNER_RESOURCE_GROUP }}" --name "${{ vars.AZURE_RUNNER_VM_NAME }}"

  build:
    needs: [mode, start_runner]
    runs-on: [self-hosted, linux, x64, theater-pipeline]
    env:
      PIPELINE_MODE: ${{ needs.mode.outputs.pipeline_mode }}
      POST_MODE: ${{ github.event_name == 'schedule' && 'live' || github.event_name == 'workflow_dispatch' && github.event.inputs.post_mode || 'off' }}
      FORCE_COLLECT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_collect || false }}
      TZ: Asia/Tokyo
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT || 'gpt-5-4-nano' }}
      AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION || '2024-10-21' }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install pytest

      - name: Run unit tests
        run: python -m pytest tests/ -q

      - name: Validate required secrets
        if: env.PIPELINE_MODE == 'full' || env.PIPELINE_MODE == 'post-only'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PIPELINE_MODE" == "full" ]]; then
            test -n "$X_BEARER_TOKEN" || { echo "X_BEARER_TOKEN is required"; exit 1; }
            test -n "$AZURE_OPENAI_API_KEY" || { echo "AZURE_OPENAI_API_KEY is required"; exit 1; }
            test -n "$AZURE_OPENAI_ENDPOINT" || { echo "AZURE_OPENAI_ENDPOINT is required"; exit 1; }
          fi
          if [[ "$PIPELINE_MODE" == "post-only" && "$POST_MODE" == "off" ]]; then
            echo "post-only requires post_mode=live or post_mode=dry-run"
            exit 1
          fi
          if [[ "$POST_MODE" == "live" ]]; then
            test -n "$X_API_KEY" || { echo "X_API_KEY is required for live posting"; exit 1; }
            test -n "$X_API_SECRET" || { echo "X_API_SECRET is required for live posting"; exit 1; }
            test -n "$X_ACCESS_TOKEN" || { echo "X_ACCESS_TOKEN is required for live posting"; exit 1; }
            test -n "$X_ACCESS_TOKEN_SECRET" || { echo "X_ACCESS_TOKEN_SECRET is required for live posting"; exit 1; }
          fi

      - name: Restore pipeline caches
        if: env.PIPELINE_MODE != 'pages'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/output/posted_events.csv
            data/output/structured_events_cumulative.csv
            data/output/structured_events_filtered_cumulative.csv
            data/output/event_cumulative.csv
            data/output/_state/
            data/output/query_collection_metrics.csv
            data/output/query_effectiveness_review.csv
          key: posted-events-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            posted-events-${{ github.ref_name }}-

      - name: Restore durable pipeline history
        if: env.PIPELINE_MODE != 'pages'
        shell: bash
        env:
          ACTIONS_REPO_TOKEN: ${{ github.token }}
          PIPELINE_HISTORY_ARTIFACT_NAME: pipeline-history-${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import io
          import json
          import os
          import zipfile
          from pathlib import Path
          from urllib import error, parse, request

          output_dir = Path("data/output")
          structured_path = output_dir / "structured_events_cumulative.csv"
          posted_path = output_dir / "posted_events.csv"
          last_seen_path = output_dir / "_state" / "last_seen_tweet_ids.json"
          collection_state_path = output_dir / "_state" / "query_collection_state.json"
          metrics_path = output_dir / "query_collection_metrics.csv"

          if (
            structured_path.exists()
            and posted_path.exists()
            and last_seen_path.exists()
            and collection_state_path.exists()
            and metrics_path.exists()
          ):
            print("durable history restore skipped: cache already restored structured and posted logs")
            raise SystemExit(0)

          token = os.environ["ACTIONS_REPO_TOKEN"].strip()
          artifact_name = os.environ["PIPELINE_HISTORY_ARTIFACT_NAME"].strip()
          repository = os.environ["REPOSITORY"].strip()
          list_url = (
            f"https://api.github.com/repos/{repository}/actions/artifacts?"
            f"{parse.urlencode({'name': artifact_name, 'per_page': 100})}"
          )
          headers = {
            "Accept": "application/vnd.github+json",
            "Authorization": f"Bearer {token}",
            "User-Agent": "hokuriku-theater-pipeline",
          }

          try:
            api_request = request.Request(list_url, headers=headers)
            with request.urlopen(api_request, timeout=30) as response:
              payload = json.loads(response.read().decode("utf-8"))
          except error.HTTPError as exc:
            print(f"durable history restore skipped: artifact listing failed with HTTP {exc.code}")
            raise SystemExit(0)
          except error.URLError as exc:
            print(f"durable history restore skipped: artifact listing failed: {exc}")
            raise SystemExit(0)

          artifacts = [artifact for artifact in payload.get("artifacts", []) if not artifact.get("expired")]
          if not artifacts:
            print(f"durable history restore skipped: no artifact named {artifact_name}")
            raise SystemExit(0)

          latest_artifact = max(
            artifacts,
            key=lambda artifact: str(artifact.get("updated_at") or artifact.get("created_at") or ""),
          )
          class NoRedirectHandler(request.HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, headers, newurl):
              return None

          redirect_opener = request.build_opener(NoRedirectHandler)
          archive_download_url = str(latest_artifact["archive_download_url"])
          signed_download_url = ""
          try:
            download_request = request.Request(archive_download_url, headers=headers)
            with redirect_opener.open(download_request, timeout=60) as response:
              signed_download_url = str(response.headers.get("Location") or response.geturl() or "")
          except error.HTTPError as exc:
            if exc.code not in {301, 302, 303, 307, 308}:
              print(f"durable history restore skipped: artifact download handshake failed with HTTP {exc.code}")
              raise SystemExit(0)
            signed_download_url = str(exc.headers.get("Location") or "")
          except error.URLError as exc:
            print(f"durable history restore skipped: artifact download handshake failed: {exc}")
            raise SystemExit(0)

          if not signed_download_url:
            print(f"durable history restore skipped: artifact {latest_artifact['id']} returned no download URL")
            raise SystemExit(0)

          try:
            signed_request = request.Request(
              signed_download_url,
              headers={"User-Agent": "hokuriku-theater-pipeline"},
            )
            with request.urlopen(signed_request, timeout=60) as response:
              artifact_bytes = response.read()
          except error.HTTPError as exc:
            print(f"durable history restore skipped: signed artifact download failed with HTTP {exc.code}")
            raise SystemExit(0)
          except error.URLError as exc:
            print(f"durable history restore skipped: signed artifact download failed: {exc}")
            raise SystemExit(0)

          with zipfile.ZipFile(io.BytesIO(artifact_bytes)) as artifact_zip:
            artifact_members = artifact_zip.namelist()
            snapshot_name = next((name for name in artifact_members if name.endswith("pipeline_history_snapshot.zip")), "")
            if not snapshot_name:
              print(f"durable history restore skipped: artifact {latest_artifact['id']} has no pipeline_history_snapshot.zip")
              raise SystemExit(0)
            snapshot_bytes = artifact_zip.read(snapshot_name)

          with zipfile.ZipFile(io.BytesIO(snapshot_bytes)) as snapshot_zip:
            snapshot_zip.extractall(Path("."))

          print(
            "restored durable history artifact:",
            latest_artifact.get("id"),
            latest_artifact.get("updated_at") or latest_artifact.get("created_at") or "",
          )
          PY

      - name: Seed cumulative history baseline
        if: env.PIPELINE_MODE != 'pages'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path

          seed_path = Path("data/bootstrap/structured_events_cumulative_seed.csv")
          output_dir = Path("data/output")
          structured_path = output_dir / "structured_events_cumulative.csv"
          filtered_path = output_dir / "structured_events_filtered_cumulative.csv"

          if not seed_path.exists():
            raise SystemExit(0)

          def load_rows(path: Path):
            if not path.exists():
              return [], []
            with path.open("r", encoding="utf-8-sig", newline="") as handle:
              reader = csv.DictReader(handle)
              return list(reader), list(reader.fieldnames or [])

          seed_rows, seed_fields = load_rows(seed_path)
          current_rows, current_fields = load_rows(structured_path)
          fieldnames = list(seed_fields or current_fields)
          for fieldname in current_fields:
            if fieldname not in fieldnames:
              fieldnames.append(fieldname)

          # seed は手動で正した baseline。cache/artifact 由来の current より優先させる。
          merged_by_tweet_url = {}
          for row in current_rows:
            tweet_url = (row.get("tweet_url") or "").strip()
            if tweet_url:
              merged_by_tweet_url[tweet_url] = row
          for row in seed_rows:
            tweet_url = (row.get("tweet_url") or "").strip()
            if tweet_url:
              merged_by_tweet_url[tweet_url] = row

          merged_rows = sorted(
            merged_by_tweet_url.values(),
            key=lambda row: ((row.get("created_at") or ""), (row.get("tweet_url") or "")),
            reverse=True,
          )
          filtered_rows = [row for row in merged_rows if str(row.get("is_noise") or "").lower() != "true"]

          output_dir.mkdir(parents=True, exist_ok=True)
          for path, rows in ((structured_path, merged_rows), (filtered_path, filtered_rows)):
            with path.open("w", encoding="utf-8-sig", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(rows)

          print(f"seeded cumulative structured rows: {len(merged_rows)}")
          print(f"seeded cumulative filtered rows: {len(filtered_rows)}")
          PY

      - name: Run API pipeline
        if: env.PIPELINE_MODE == 'full'
        shell: bash
        run: |
          set -euo pipefail
          args=()
          case "$POST_MODE" in
            live)
              args+=(--post-new-events)
              ;;
            dry-run)
              args+=(--post-new-events --post-dry-run)
              ;;
          esac
          if [[ "$FORCE_COLLECT" == "true" ]]; then
            args+=(--force-collect)
          fi
          python src/run_pipeline.py "${args[@]}"

      - name: Build schedule list for post-only
        if: env.PIPELINE_MODE == 'post-only'
        shell: bash
        run: |
          set -euo pipefail
          test -f data/output/event_cumulative.csv || {
            echo "data/output/event_cumulative.csv is required for post-only"
            exit 1
          }
          python src/build_schedule_list.py --events-csv data/output/event_cumulative.csv

      - name: Run X post-only pipeline
        if: env.PIPELINE_MODE == 'post-only'
        shell: bash
        run: |
          set -euo pipefail
          args=(
            src/post_new_events_to_x.py
            --events-csv data/output/event_cumulative.csv
            --posted-log-csv data/output/posted_events.csv
            --allowed-event-ids-csv data/output/schedule_list.csv
          )
          if [[ "$POST_MODE" == "dry-run" ]]; then
            args+=(--dry-run)
          fi
          python "${args[@]}"

      - name: Run rebuild pipeline
        if: env.PIPELINE_MODE == 'rebuild'
        shell: bash
        run: python src/run_pipeline.py --rebuild-only

      - name: Monthly query effectiveness review
        if: success() && env.PIPELINE_MODE == 'full' && github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(date +%d)" != "01" ]]; then
            echo "monthly query review is scheduled for the first day of the month"
            exit 0
          fi
          python src/review_query_effectiveness.py

      - name: Save posted event log
        if: ${{ !cancelled() && env.PIPELINE_MODE != 'pages' && (hashFiles('data/output/posted_events.csv') != '' || hashFiles('data/output/structured_events_cumulative.csv') != '' || hashFiles('data/output/structured_events_filtered_cumulative.csv') != '' || hashFiles('data/output/event_cumulative.csv') != '' || hashFiles('data/output/_state/**') != '' || hashFiles('data/output/query_collection_metrics.csv') != '') }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/output/posted_events.csv
            data/output/structured_events_cumulative.csv
            data/output/structured_events_filtered_cumulative.csv
            data/output/event_cumulative.csv
            data/output/_state/
            data/output/query_collection_metrics.csv
            data/output/query_effectiveness_review.csv
          key: posted-events-${{ github.ref_name }}-${{ github.run_id }}

      - name: Build durable pipeline history snapshot
        if: ${{ !cancelled() && env.PIPELINE_MODE != 'pages' && (hashFiles('data/output/posted_events.csv') != '' || hashFiles('data/output/structured_events_cumulative.csv') != '' || hashFiles('data/output/structured_events_filtered_cumulative.csv') != '' || hashFiles('data/output/event_cumulative.csv') != '' || hashFiles('data/output/_state/**') != '' || hashFiles('data/output/query_collection_metrics.csv') != '') }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile

          snapshot_path = Path("data/output/pipeline_history_snapshot.zip")
          snapshot_path.parent.mkdir(parents=True, exist_ok=True)
          files = [
              Path("data/output/posted_events.csv"),
              Path("data/output/structured_events_cumulative.csv"),
              Path("data/output/structured_events_filtered_cumulative.csv"),
              Path("data/output/event_cumulative_base.csv"),
              Path("data/output/event_cumulative.csv"),
              Path("data/output/_state/last_seen_tweet_ids.json"),
              Path("data/output/_state/query_collection_state.json"),
              Path("data/output/query_collection_metrics.csv"),
              Path("data/output/query_effectiveness_review.csv"),
          ]

          with zipfile.ZipFile(snapshot_path, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for path in files:
                  if path.exists():
                      archive.write(path, arcname=str(path).replace("\\", "/"))

          print(f"built durable history snapshot: {snapshot_path}")
          PY

      - name: Upload durable pipeline history
        if: ${{ !cancelled() && env.PIPELINE_MODE != 'pages' && hashFiles('data/output/pipeline_history_snapshot.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-history-${{ github.ref_name }}
          path: data/output/pipeline_history_snapshot.zip
          retention-days: 90

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Sync web/ to docs/
        run: python src/sync_web_to_docs.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Notify failure via Issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title="Daily pipeline failed: $(date -u +%Y-%m-%dT%H:%MZ)"
          body=$'Daily Theater Pipeline が失敗しました。\n\nRun: '"$RUN_URL"$'\nTrigger: ${{ github.event_name }}\nRef: ${{ github.ref_name }}'
          existing=$(gh issue list --state open --label pipeline-failure --search "Daily pipeline failed in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label pipeline-failure || \
              gh issue create --title "$title" --body "$body"
          fi

  stop_runner:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_RUNNER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deallocate self-hosted runner VM
        run: az vm deallocate --resource-group "${{ vars.AZURE_RUNNER_RESOURCE_GROUP }}" --name "${{ vars.AZURE_RUNNER_VM_NAME }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4